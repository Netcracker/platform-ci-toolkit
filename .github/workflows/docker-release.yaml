---

# This workflow is used to release Docker images.
# The workflow is triggered manually and allows the user to specify the release version.
# The workflow also creates a GitHub release after the deployment stage if the deployment is successful.
# The workflow requires the following inputs:
# - `release`: The release version to publish.
# The workflow requires several configuration files:
# - Docker build configuration file: `.qubership/docker.cfg`
#   Example: config/examples/docker.cfg
#   Full description of configuration file can be found in docs https://github.com/Netcracker/qubership-workflow-hub/tree/main/actions/docker-config-resolver
# - GitHub release drafter configuration file: `.github/release-drafter-config.yml`
#   Example: config/examples/release-drafter-config.yml

name: "Docker Images Release"
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version e.g. 1.0.0 (numbers and dots only). "v" prefix will be added automatically.'
        required: true
        type: string

permissions:
  contents: read
run-name: ${{ github.repository }} Release ${{ github.event.inputs.release }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIG_FILE: '.qubership/docker.cfg'

jobs:
  check-tag:
    name: "Check if tag exists"
    runs-on: ubuntu-latest
    steps:
      - name: "Check if tag exists"
        id: check_tag
        uses: netcracker/qubership-workflow-hub/actions/tag-action@288a6a0d9a78e80dfdefccab1be6497a39deb746  # v2.8.0
        with:
          tag-name: 'v${{ inputs.release }}'
          ref: ${{ github.ref }}
          create-tag: false
          check-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve-config:
    name: "Load Docker Build Components Configuration"
    needs: [check-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      config: ${{ steps.resolve.outputs.config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Resolve docker config"
        id: resolve
        uses: netcracker/qubership-workflow-hub/actions/docker-config-resolver@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        with:
          file-path: ${{ env.CONFIG_FILE }}

  create-tag:
    name: "Create Release Tag"
    needs: [resolve-config]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Create Tag"
        uses: netcracker/qubership-workflow-hub/actions/tag-action@288a6a0d9a78e80dfdefccab1be6497a39deb746  # v2.8.0
        with:
          tag-name: 'v${{ inputs.release }}'
          ref: ${{ github.ref }}
          create-tag: true
          check-tag: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: "${{ matrix.component.name }}"
    needs: [resolve-config, create-tag]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.resolve-config.outputs.config) }}
    steps:
      - name: "Docker build and publish"
        uses: netcracker/qubership-workflow-hub/actions/docker-action@288a6a0d9a78e80dfdefccab1be6497a39deb746  # v2.8.0
        with:
          ref: 'v${{ inputs.release }}'
          download-artifact: false
          dry-run: false
          component: ${{ toJson(matrix.component) }}
          platforms: ${{ matrix.component.platforms }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: "Github Release"
    needs: [docker-build]
    continue-on-error: false
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ inputs.release }}
          persist-credentials: false

      - name: "Release-drafter"
        uses: netcracker/release-drafter@130c08399304912ffe90e9604e4328f2fdcd7619  # v1.0.1
        with:
          config-name: release-drafter-config.yml
          publish: true
          name: ${{ inputs.release }}
          tag: v${{ inputs.release }}
          version: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
