name: Common Linter

on:
  workflow_call:
    inputs:
      default_branch:
        description: 'Default branch used by Super-Linter for diffing'
        required: false
        type: string
        default: master
      validate_all_codebase:
        description: 'Whether to lint the whole codebase or only changed files'
        required: false
        type: boolean
        default: false
    secrets:
      registry_username:
        description: 'Username for the container registry hosting the linter image'
        required: false
      registry_password:
        description: 'Password for the container registry hosting the linter image'
        required: false

jobs:
  lint:
    name: Run common linter
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/netcracker/linter:latest
      credentials:
        username: ${{ secrets.registry_username }}
        password: ${{ secrets.registry_password }}
      options: --entrypoint=""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run common linter
        env:
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase }}
          RUN_LOCAL: true
        run: make lint
